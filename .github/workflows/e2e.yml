name: E2E Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  e2e:
    name: Run E2E tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Build docs and start preview server
        run: |
          pnpm run docs:build
          pnpm run preview &
          echo "Waiting for preview on 4172..."
          npx wait-on http://127.0.0.1:4172 -t 300000

      - name: Run E2E Tests
        env:
          SKIP_WEBSERVER: '1'
        run: pnpm run test:e2e
